server {
    listen 80;
    root /usr/share/nginx/html;

    # Redireciona raiz para /Art-mis/
    location = / {
        return 301 /Art-mis/;
    }

    # Serve o SPA React — todas as rotas caem no index.html (client-side routing)
    location /Art-mis/ {
        try_files $uri $uri/ /Art-mis/index.html;
    }

    # Proxy para o backend FastAPI (REST e WebSocket)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
