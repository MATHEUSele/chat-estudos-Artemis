server {
    listen 80;
    root /usr/share/nginx/html;

    # Redireciona raiz para /Art-mis/
    location = / {
        return 301 /Art-mis/;
    }

    # Serve o SPA React — todas as rotas caem no index.html (client-side routing)
    location /Art-mis/ {
        try_files $uri $uri/ /Art-mis/index.html;
    }

    # Proxy para o backend FastAPI (SSE / REST)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
