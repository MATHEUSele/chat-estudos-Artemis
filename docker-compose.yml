services:
  ollama:
    image: ollama/ollama
    container_name: artemis-ollama
    volumes:
      - ollama_data:/root/.ollama   # persiste o modelo entre restarts
    ports:
      - "11434:11434"               # expõe para o host (útil para testes)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: artemis-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/artemis.db:/app/artemis.db  # persiste o banco de dados SQLite
    depends_on:
      ollama:
        condition: service_healthy            # aguarda Ollama estar pronto
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: artemis-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:   # volume nomeado — modelo persiste entre restarts
